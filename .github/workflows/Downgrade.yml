# ABOUTME: Runs the test suite on the lowest Julia and dependency versions that Project.toml allows.
# ABOUTME: Fails when a dependency resolves above its declared lower bound, so the bounds stay real.
name: Downgrade
on:
  pull_request:
    paths:
      - Project.toml
jobs:
  test:
    name: Lowest compat bounds
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: min
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-downgrade-compat@v2
        with:
          mode: forcedeps
          skip: Dates,Distributed,LinearAlgebra,REPL,Random,SHA,Serialization,Statistics,Test,Unicode
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          allow_reresolve: false
          force_latest_compatible_version: false
